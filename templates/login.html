{% extends "base.html" %}
{% block title %}Login - Corruption Detection{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm border-0 rounded-3">
      <div class="card-body p-4">
        <h4 class="card-title mb-3 text-center">Sign in</h4>
        <p class="text-muted text-center small mb-4">
          Admin and officers can log in to manage schemes and monitor transactions.
        </p>
        <form method="post" novalidate>
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input
              type="text"
              class="form-control"
              id="username"
              name="username"
              required
              autofocus
            >
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              required
            >
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">
              Login
            </button>
          </div>
        </form>
        <hr class="my-4">
        <div class="text-center">
          <p class="mb-2">Don't have an account?</p>
          <a href="{{ url_for('signup') }}" class="btn btn-outline-primary btn-sm">
            Sign Up
          </a>
        </div>
        <hr class="my-4">
      
      </div>
    </div>
  </div>
</div>
{% endblock %}
